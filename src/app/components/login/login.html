<div class="login-container">

  <h2>Iniciar Sesión</h2>

  <form (ngSubmit)="login()">

    <div class="form-group">
      <label>Email</label>
      <input
        type="email"
        [(ngModel)]="email"
        name="email"
        required
        placeholder="Ingresa tu email"
      />
    </div>

    <div class="form-group">
      <label>Contraseña</label>
      <input
        type="password"
        [(ngModel)]="password"
        name="password"
        required
        placeholder="Ingresa tu contraseña"
      />
    </div>

    <button type="submit">
      Ingresar
    </button>

  </form>

  <p class="mensaje">
    {{ mensaje }}
  </p>

</div>
